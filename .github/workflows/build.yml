name: Build app packages

on:
  push:
    branches: [main, master]
    # 打任意 tag（v0.2.80 或 0.2.80）都会触发打包；打 tag 时额外发布 GitHub Release
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  # 检查拆成三个互不依赖的 job：脚本、Dart、Go 各自独立上报结果，
  # 前面的格式或 Flutter 失败不会再掩盖后面的 Go 结果。与打包 job 的关系不变。
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      # 格式检查失败时把 dart format 的结果导成补丁，便于在没有 Dart 工具链的机器上直接 git apply。
      - name: 导出格式化补丁
        if: failure()
        run: |
          dart format lib test integration_test test_driver
          git diff > format.patch
          wc -l format.patch
      - name: 上传格式化补丁
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: format-patch
          path: format.patch
          if-no-files-found: ignore
          retention-days: 7
      - run: dart analyze lib test integration_test test_driver
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true
      # 全站源变体独立上报：默认测试失败时也要跑完，否则一套测试红就看不到另一套的结果。
      - name: 全站源变体的 Flutter 测试
        if: ${{ !cancelled() }}
        run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - run: go test -race ./...
        working-directory: native
      - run: go test -race -ldflags="-X duanjuapp/native/core.buildAllSources=true" ./...
        working-directory: native

  # 打包 job 不依赖上面三个检查 job：检查失败只影响状态，不阻塞出包。
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Install Android NDK 28.2.13676358
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install 'ndk;28.2.13676358'
      - name: Configure Android signing
        run: python scripts/configure_signing.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: python scripts/build_android.py ${{ matrix.arguments }}
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14

  # Windows 打包暂时注释掉：windows-latest 上 egor-tensin/setup-mingw@v2 装 MinGW 直接失败，
  # build_windows.py 根本没开始跑（job 一直红，只靠 continue-on-error 不阻塞流水线，没意义）。
  # 要恢复 Windows 出包：取消下面注释，并把 setup-mingw 换成可用方案
  # （例如 msys2/setup-msys2@v2 + mingw-w64-x86_64-gcc，或在 windows-latest 上 choco install mingw）。
  #
  # windows:
  #   continue-on-error: true
  #   runs-on: windows-latest
  #   timeout-minutes: 45
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       include:
  #         - edition: hongguojian
  #           arguments: ''
  #         - edition: zhenguojian
  #           arguments: '--all-sources'
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-go@v5
  #       with:
  #         go-version-file: native/go.mod
  #         cache-dependency-path: native/go.sum
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: '3.12'
  #     - uses: subosito/flutter-action@v2
  #       with:
  #         flutter-version: '3.47.4'
  #         channel: stable
  #         cache: true
  #     - uses: egor-tensin/setup-mingw@v2
  #       with:
  #         platform: x64
  #     - run: python scripts/build_windows.py ${{ matrix.arguments }}
  #     - run: choco install ffmpeg --no-progress -y
  #     - run: python scripts/smoke_windows.py ${{ matrix.arguments }}
  #     - uses: actions/upload-artifact@v4
  #       with:
  #         name: ${{ matrix.edition }}-windows
  #         path: dist/windows/*
  #         if-no-files-found: error
  #         retention-days: 14

  # iOS 打包保留，允许失败：未验收、不拖红流水线，也不依赖 checks。
  ios:
    continue-on-error: true
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: python3 scripts/build_ios.py ${{ matrix.arguments }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-ios-unsigned
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14

  # 每次打包成功都会发布/更新 Release（PR 除外）：
  #   - 打 tag  -> 发布以该 tag 命名的版本（例如 0.2），打出来的 apk / ios 包作为附件
  #   - 推分支/手动触发 -> 更新滚动版本 latest，保证 Releases 页永远有最新安装包
  release:
    # 等待 iOS 产物落定，但 iOS 失败不妨碍发布已经成功的 Android 包。
    needs: [android, ios]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-${{ github.repository }}-${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 校验新附件后发布 / 更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IOS_RESULT: ${{ needs.ios.result }}
        run: python3 scripts/publish_release.py
